<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 640"
     font-family="ui-sans-serif, -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <style>
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 1.5; }
      .arrow { stroke: #94A3B8; stroke-width: 1.5; fill: none; }
      .arrow-d { stroke: #94A3B8; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .label { font-size: 13px; fill: #0F172A; }
      .label-sm { font-size: 11px; fill: #64748B; }
      .label-strong { font-size: 14px; font-weight: 600; fill: #0F172A; }
      .edge { font-size: 11px; fill: #64748B; }
      .cf { fill: #F38020; }
      .gh { fill: #1F2937; }
      .hetzner { fill: #D50C1F; }
      .r2 { fill: #CC7700; }
      .caddy { fill: #0D9488; }
    </style>
  </defs>

  <!-- User -->
  <rect class="card" x="380" y="20" width="120" height="44" rx="8"/>
  <text x="440" y="40" text-anchor="middle" class="label-strong">User</text>
  <text x="440" y="56" text-anchor="middle" class="label-sm">browser</text>

  <line x1="440" y1="64" x2="440" y2="98" class="arrow" marker-end="url(#ah)"/>

  <!-- Cloudflare DNS -->
  <rect class="card" x="80" y="100" width="720" height="62" rx="10"/>
  <circle class="cf" cx="100" cy="119" r="5"/>
  <text x="112" y="124" class="label-strong">Cloudflare DNS</text>
  <text x="228" y="124" class="label-sm">· free plan · DNSSEC</text>
  <text x="100" y="148" class="label-sm">grey-cloud A records pass directly to origins · proxied records get edge TLS + CDN</text>

  <!-- routes from DNS -->
  <line x1="200" y1="162" x2="200" y2="196" class="arrow" marker-end="url(#ah)"/>
  <text x="206" y="184" class="edge">shiori, slides</text>

  <line x1="460" y1="162" x2="460" y2="196" class="arrow" marker-end="url(#ah)"/>
  <text x="466" y="184" class="edge">blog · CNAME, grey</text>

  <line x1="700" y1="162" x2="700" y2="196" class="arrow" marker-end="url(#ah)"/>
  <text x="706" y="184" class="edge">api.* records</text>

  <!-- Cloudflare Pages -->
  <rect class="card" x="80" y="200" width="240" height="160" rx="10"/>
  <circle class="cf" cx="100" cy="219" r="5"/>
  <text x="112" y="223" class="label-strong">Cloudflare Pages / Workers</text>
  <line x1="96" y1="240" x2="304" y2="240" stroke="#E2E8F0"/>
  <text x="100" y="265" class="label">shiori.nhade.com</text>
  <text x="100" y="282" class="label-sm">Pages · Vue / Vite · built from main</text>
  <text x="100" y="316" class="label">slides.nhade.com</text>
  <text x="100" y="333" class="label-sm">Workers · static lecture HTMLs</text>

  <!-- GitHub Pages -->
  <rect class="card" x="350" y="200" width="220" height="120" rx="10"/>
  <circle class="gh" cx="370" cy="219" r="5"/>
  <text x="382" y="223" class="label-strong">GitHub Pages</text>
  <line x1="366" y1="240" x2="554" y2="240" stroke="#E2E8F0"/>
  <text x="370" y="265" class="label">blog.nhade.com</text>
  <text x="370" y="282" class="label-sm">this site · CNAME to nhade.github.io</text>
  <text x="370" y="299" class="label-sm">DNS-only · GH handles TLS</text>

  <!-- Hetzner -->
  <rect class="card" x="600" y="200" width="200" height="260" rx="10"/>
  <circle class="hetzner" cx="620" cy="219" r="5"/>
  <text x="632" y="223" class="label-strong">Hetzner CX23 · EU</text>
  <text x="618" y="240" class="label-sm">€3.99/mo · 2 vCPU · 4 GB</text>
  <line x1="616" y1="252" x2="784" y2="252" stroke="#E2E8F0"/>

  <rect x="616" y="266" width="168" height="34" rx="6" fill="#ECFEFF" stroke="#5EEAD4"/>
  <circle class="caddy" cx="630" cy="283" r="4"/>
  <text x="642" y="287" class="label-strong">Caddy reverse proxy</text>

  <rect x="616" y="312" width="78" height="48" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="655" y="332" text-anchor="middle" class="label-strong">Shiori</text>
  <text x="655" y="350" text-anchor="middle" class="label-sm">Flask · :5000</text>

  <rect x="706" y="312" width="78" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-dasharray="3 3"/>
  <text x="745" y="332" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">AntiCopilot</text>
  <text x="745" y="350" text-anchor="middle" class="label-sm">FastAPI · pending</text>

  <rect x="616" y="376" width="168" height="40" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="700" y="394" text-anchor="middle" class="label-strong">SQLite</text>
  <text x="700" y="410" text-anchor="middle" class="label-sm">/srv/shiori/db.sqlite3</text>

  <text x="616" y="436" class="label-sm">auto-updates · fail2ban</text>
  <text x="616" y="450" class="label-sm">apps user · key-only SSH</text>

  <!-- arrow SQLite -> R2 -->
  <line x1="700" y1="460" x2="700" y2="510" class="arrow-d" marker-end="url(#ah)"/>
  <text x="710" y="488" class="edge">nightly · gz</text>

  <!-- R2 -->
  <rect class="card" x="600" y="515" width="200" height="60" rx="10"/>
  <circle class="r2" cx="620" cy="534" r="5"/>
  <text x="632" y="538" class="label-strong">Cloudflare R2</text>
  <line x1="616" y1="548" x2="784" y2="548" stroke="#E2E8F0"/>
  <text x="616" y="567" class="label-sm">shiori-backups bucket · free egress</text>
</svg>
